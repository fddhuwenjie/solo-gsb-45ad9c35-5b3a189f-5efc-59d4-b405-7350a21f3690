services:
  api:
    build: .
    image: tempo-map-api:latest
    container_name: tempo-map-api
    environment:
      # SQLite 数据库放到命名卷；`docker compose down` 后再 up（卷保留）
      # 已创建/发布的谱例仍可读取；`down -v` 才会清除。
      TEMPO_DB_PATH: /data/tempo.db
    volumes:
      - tempo-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  tempo-data:
